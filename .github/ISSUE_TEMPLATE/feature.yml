name: Feature request
description: Propose a new capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behavior does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. Commands, file formats or examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today or other designs you thought about.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: The data platforms this applies to.
      multiple: true
      options:
        - Not platform specific
        - Local (DuckDB)
        - Databricks
        - Snowflake
        - Microsoft Fabric
