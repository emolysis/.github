name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The gate skips drafts; ready_for_review runs it when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Opening a pull request as a draft starts no runner.
    if: ${{ !github.event.pull_request.draft }}
    # The job name is the required status check; keep it `gate`.
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: task setup
        run: task setup
      - name: task gate
        run: task gate
